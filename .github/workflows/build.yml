name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push makes older runs on the same branch pointless
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Minecraft ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.21.1", "1.21.3", "1.21.4", "1.21.5", "1.21.8", "1.21.10", "1.21.11", "26.1.2", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew ":${{ matrix.version }}:buildAndCollect" --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: version-jar-${{ matrix.version }}
          path: build/libs/*/*.jar
          if-no-files-found: error

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-vulkan-drivers libvulkan1

      # Starts the real game. Client game tests (armor stands, screenshots) where Fabric's game test API works
      # reliably on CI runners; a boot-and-self-check elsewhere (no game test API before 1.21.4, and on
      # 1.21.10/1.21.11 the game test's world creation stalls at "Preparing spawn area" on CI runners).
      # The game runs on our own 24-bit virtual display; Loom's default one (8-bit, used when CI is set)
      # has no usable GLX visual for 26.3 and makes software rendering crawl on older versions.
      # 26.3 renders through OpenGL or Vulkan; on CI the software Vulkan driver (lavapipe) is the one that works
      - name: Run in-game test
        timeout-minutes: 15
        run: |
          set -o pipefail
          game() { env -u CI xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +render -noreset" ./gradlew "$@" --stacktrace; }
          if [[ " 1.21.1 1.21.3 1.21.10 1.21.11 " == *" ${{ matrix.version }} "* ]]; then
            game ":${{ matrix.version }}:runClient" -PsmokeTest
            grep -q "Smoke test passed" run/logs/latest.log
          else
            # Software rendering on shared runners sometimes misses the game test's fixed world loading
            # timeout; only that specific failure gets one more attempt.
            if ! game ":${{ matrix.version }}:runClientGameTest" 2>&1 | tee gametest.log; then
              grep -q "Timeout loading world" gametest.log || exit 1
              echo "World loading timed out on the runner, trying once more"
              game ":${{ matrix.version }}:runClientGameTest"
            fi
          fi

      - name: Frame gallery images
        if: matrix.version == '26.2'
        run: |
          pip install --quiet pillow
          python3 .github/scripts/gallery.py . gallery
          python3 .github/scripts/contact_sheet.py .

      - uses: actions/upload-artifact@v4
        if: matrix.version == '26.2'
        with:
          name: gallery
          path: gallery/*.png

      # Keeps docs/gallery (used by the README and for Modrinth) in sync with the latest game screenshots
      - name: Publish gallery to the repository
        if: matrix.version == '26.2' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main
            # Only the newest code may publish: skip if someone pushed after this run started
            if git log --format=%an "$GITHUB_SHA..origin/main" | grep -qv "github-actions\[bot\]"; then
              echo "main has newer commits, leaving the gallery to their run"; exit 0
            fi
            git checkout -q -B publish-gallery origin/main
            mkdir -p docs/gallery
            cp gallery/*.png docs/gallery/
            git add docs/gallery
            if git diff --cached --quiet; then exit 0; fi
            git commit -q -m "Update gallery screenshots [skip ci]"
            if git push -q origin HEAD:main; then exit 0; fi
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output-${{ matrix.version }}
          path: |
            **/screenshots/*.png
            **/crash-reports/*.txt
            **/logs/latest.log
          if-no-files-found: ignore

  universal:
    name: Universal jar
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: version-jar-*
          path: downloaded
      - name: Pack one jar for every version
        run: |
          version=$(grep '^mod.version' stonecutter.properties.toml | cut -d '"' -f 2)
          mkdir -p "build/libs/$version"
          find downloaded -name '*.jar' -exec cp {} "build/libs/$version/" \;
          ls -l "build/libs/$version"
          ./gradlew universalJar -PskipBuild --stacktrace
          unzip -l build/libs/durabilitytweaks-$version.jar
      - uses: actions/upload-artifact@v4
        with:
          name: durabilitytweaks-universal
          path: build/libs/durabilitytweaks-*.jar
          if-no-files-found: error

  # Starts a production-like client with only the universal jar on every version group
  universal-test:
    name: Universal jar on ${{ matrix.version }}
    needs: universal
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.21.1", "1.21.3", "1.21.4", "1.21.5", "1.21.8", "1.21.10", "1.21.11", "26.1.2", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: durabilitytweaks-universal
          path: universal
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-vulkan-drivers libvulkan1
      - name: Run the universal jar
        timeout-minutes: 20
        run: |
          jar=$(ls "$PWD"/universal/durabilitytweaks-*.jar)
          env -u CI xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +render -noreset" ./gradlew ":${{ matrix.version }}:runUniversalJar" -PuniversalJar="$jar" --stacktrace
          grep -h "Loading .* mods\|durabilitytweaks" -r --include=latest.log . | head -20
          grep -rq "Smoke test passed" --include=latest.log .
