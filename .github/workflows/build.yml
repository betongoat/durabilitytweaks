name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Minecraft ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.21.1", "1.21.3", "1.21.4", "1.21.5", "1.21.8", "1.21.10", "1.21.11", "26.1.2", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew ":${{ matrix.version }}:buildAndCollect" --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: durabilitytweaks-${{ matrix.version }}
          path: build/libs/*/*.jar
          if-no-files-found: error

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri

      # Starts the real game: client game tests with screenshots on 1.21.4+, a boot-to-title-screen check before that
      - name: Run in-game test
        timeout-minutes: 25
        run: |
          if [[ "${{ matrix.version }}" == "1.21.1" || "${{ matrix.version }}" == "1.21.3" ]]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew ":${{ matrix.version }}:runClient" -PsmokeTest --stacktrace
            grep -q "Smoke test passed" run/logs/latest.log
          else
            xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew ":${{ matrix.version }}:runClientGameTest" --stacktrace
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output-${{ matrix.version }}
          path: |
            **/screenshots/*.png
            **/crash-reports/*.txt
            **/logs/latest.log
          if-no-files-found: ignore

  collect:
    name: Collect jars
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: durabilitytweaks-*
          path: jars
          merge-multiple: true
      - uses: actions/upload-artifact@v4
        with:
          name: durabilitytweaks-all-versions
          path: jars/**/*.jar
