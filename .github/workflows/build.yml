name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Minecraft ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.21.1", "1.21.3", "1.21.4", "1.21.5", "1.21.8", "1.21.10", "1.21.11", "26.1.2", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew ":${{ matrix.version }}:buildAndCollect" --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: version-jar-${{ matrix.version }}
          path: build/libs/*/*.jar
          if-no-files-found: error

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri

      # Starts the real game: client game tests with screenshots on 1.21.4+, a boot-and-self-check before that
      - name: Run in-game test
        timeout-minutes: 25
        run: |
          if [[ "${{ matrix.version }}" == "1.21.1" || "${{ matrix.version }}" == "1.21.3" ]]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew ":${{ matrix.version }}:runClient" -PsmokeTest --stacktrace
            grep -q "Smoke test passed" run/logs/latest.log
          else
            # Loom starts its own virtual display for client game tests
            ./gradlew ":${{ matrix.version }}:runClientGameTest" --stacktrace
          fi

      - name: Frame gallery images
        if: matrix.version == '1.21.11'
        run: |
          pip install --quiet pillow
          python3 .github/scripts/gallery.py . gallery
          python3 .github/scripts/contact_sheet.py .

      - uses: actions/upload-artifact@v4
        if: matrix.version == '1.21.11'
        with:
          name: gallery
          path: gallery/*.png

      # Keeps docs/gallery (used by the README and for Modrinth) in sync with the latest game screenshots
      - name: Publish gallery to the repository
        if: matrix.version == '1.21.11' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p docs/gallery
          cp gallery/*.png docs/gallery/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/gallery
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update gallery screenshots [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output-${{ matrix.version }}
          path: |
            **/screenshots/*.png
            **/crash-reports/*.txt
            **/logs/latest.log
          if-no-files-found: ignore

  universal:
    name: Universal jar
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: version-jar-*
          path: downloaded
      - name: Pack one jar for every version
        run: |
          version=$(grep '^mod.version' stonecutter.properties.toml | cut -d '"' -f 2)
          mkdir -p "build/libs/$version"
          find downloaded -name '*.jar' -exec cp {} "build/libs/$version/" \;
          ls -l "build/libs/$version"
          ./gradlew universalJar -PskipBuild --stacktrace
          unzip -l build/libs/durabilitytweaks-$version.jar
      - uses: actions/upload-artifact@v4
        with:
          name: durabilitytweaks-universal
          path: build/libs/durabilitytweaks-*.jar
          if-no-files-found: error

  # Starts a production-like client with only the universal jar on every version group
  universal-test:
    name: Universal jar on ${{ matrix.version }}
    needs: universal
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.21.1", "1.21.3", "1.21.4", "1.21.5", "1.21.8", "1.21.10", "1.21.11", "26.1.2", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: durabilitytweaks-universal
          path: universal
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Run the universal jar
        timeout-minutes: 20
        run: |
          jar=$(ls "$PWD"/universal/durabilitytweaks-*.jar)
          ./gradlew ":${{ matrix.version }}:runUniversalJar" -PuniversalJar="$jar" --stacktrace
          grep -h "Loading .* mods\|durabilitytweaks" -r --include=latest.log . | head -20
          grep -rq "Smoke test passed" --include=latest.log .
