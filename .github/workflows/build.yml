name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Minecraft ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.21.1", "1.21.3", "1.21.4", "1.21.5", "1.21.8", "1.21.10", "1.21.11", "26.1.2", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew ":${{ matrix.version }}:buildAndCollect" --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: durabilitytweaks-${{ matrix.version }}
          path: build/libs/*/*.jar
          if-no-files-found: error

  collect:
    name: Collect jars
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: durabilitytweaks-*
          path: jars
          merge-multiple: true
      - uses: actions/upload-artifact@v4
        with:
          name: durabilitytweaks-all-versions
          path: jars/**/*.jar
